spring.application.name=Crm_Project

spring.datasource.url=jdbc:postgresql://localhost:5432/postgre_db?currentSchema=crm_project
spring.jpa.properties.hibernate.default_schema=crm_project
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update


jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION}

allowed.origins=http://localhost:5173

ai.provider=openai
ai.model=gpt-4o-mini
ai.api-key=${OPENAI_API_KEY}
ai.base-url=https://api.openai.com/v1
ai.timeout-seconds=20
ai.max-output-tokens=500
ai.max-context-messages=20
ai.prompt-version=v1

#Redis
# Local bilgisayar?nda çal??t??? için localhost kullan?l?yor - Redis sunucusunun adresi
spring.data.redis.host=localhost

# Redis'in çal??t??? port - default olarak 6379
spring.data.redis.port=6379

# Redis'e yap?lan iste?in maksimum bekleme süresi
# 2 saniye içinde cevap gelmezse timeout olur
spring.data.redis.timeout=2000ms

# Ayn? anda aç?labilecek maksimum Redis ba?lant? say?s?
# Trafik art?nca performans? etkiler
spring.data.redis.lettuce.pool.max-active=10

# Bo?ta bekleyebilecek maksimum ba?lant? say?s?
# Gereksiz fazla ba?lant? tutulmas?n? engeller
spring.data.redis.lettuce.pool.max-idle=5

# Havuzda minimum tutulacak bo? ba?lant? say?s?
# Sürekli yeni ba?lant? aç?lmas?n? azalt?r
spring.data.redis.lettuce.pool.min-idle=2

# Yeni ba?lant? için havuz doluysa maksimum bekleme süresi
# 1 saniye sonra hata verir
spring.data.redis.lettuce.pool.max-wait=1000ms