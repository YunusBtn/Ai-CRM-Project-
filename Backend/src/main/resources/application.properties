spring.application.name=Crm_Project

spring.datasource.url=jdbc:postgresql://localhost:5432/postgre_db?currentSchema=crm_project
spring.jpa.properties.hibernate.default_schema=crm_project
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update


jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION}

allowed.origins=http://localhost:5173

ai.provider=openai
ai.model=gpt-4o-mini
ai.api-key=${OPENAI_API_KEY}
ai.base-url=https://api.openai.com/v1
ai.timeout-seconds=20
ai.max-output-tokens=500
ai.max-context-messages=20
ai.prompt-version=v1

#Redis
# Local bilgisayarinda calistigi icin localhost kullaniliyor - Redis sunucusunun adresi
spring.data.redis.host=localhost

# Redis'in calistigi port - default olarak 6379
spring.data.redis.port=6379

# Redis'e yapilan istegin maksimum bekleme suresi
# 2 saniye icinde cevap gelmezse timeout olur
spring.data.redis.timeout=2000ms

# Ayni anda acilabilecek maksimum Redis baglanti sayisi
# Trafik artinca performansi etkiler
spring.data.redis.lettuce.pool.max-active=10

# Bosta bekleyebilecek maksimum baglanti sayisi
# Gereksiz fazla baglanti tutulmasini engeller
spring.data.redis.lettuce.pool.max-idle=5

# Havuzda minimum tutulacak bos baglanti sayisi
# Surekli yeni baglanti acilmasini azaltir
spring.data.redis.lettuce.pool.min-idle=2

# Yeni baglanti icin havuz doluysa maksimum bekleme suresi
# 1 saniye sonra hata verir
spring.data.redis.lettuce.pool.max-wait=1000ms